appId: dev.local.dynamodb-client
productName: DynamoDB Client
directories:
  output: ../../release/desktop
files:
  - dist/**
  - package.json
asar: true
linux:
  executableName: dynamodb-client
  target:
    - AppImage
    - deb
  category: Development
  maintainer: DynamoDB Client
deb:
  packageName: dynamodb-client
  artifactName: dynamodb-client_${version}_${arch}.${ext}
mac:
  target:
    - zip
    - dmg
  category: public.app-category.developer-tools
